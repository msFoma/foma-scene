[project]
name = "live-blender-mcp"
version = "0.1.0"
description = "Foma Scene · Blender MCP for verified edits in a running scene"
requires-python = ">=3.11"
dependencies = ["mcp>=1.29,<2", "httpx>=0.27,<1", "pillow>=11,<14"]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blender_mcp*"]
